name: Build & Release AIBO APK

on:
  push:
    branches: [ dev, main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Dummy .env for CI Compilation
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Generate Android Platform Scaffolding
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          flutter create . --platforms=android --org com.aibo
          cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aibo-release-apks
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create GitHub Release (On Version Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
