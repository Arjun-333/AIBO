name: aibo
description: "AIBO (AI Buddy & Organiser) — Personal companion app for living in Japan."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # Local Storage & Encryption (AES-256)
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  flutter_secure_storage: ^9.0.0

  # Authentication (Biometric & Device PIN)
  local_auth: ^2.1.8

  # Offline Reminders & Alarms (Android AlarmManager)
  flutter_local_notifications: ^17.0.0

  # Native Intents (One-tap emergency dialing)
  url_launcher: ^6.2.4

  # Backup & Encryption (AES-256 Archive Export/Restore)
  archive: ^3.4.10
  encrypt: ^5.0.3
  crypto: ^3.0.3
  share_plus: ^7.2.2
  file_picker: ^8.0.0

  # Environment & Utilities
  http: ^1.2.0
  flutter_dotenv: ^5.1.0
  intl: ^0.19.0
  provider: ^6.1.1
  path: ^1.9.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
